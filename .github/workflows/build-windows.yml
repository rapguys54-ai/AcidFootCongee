name: Build Windows EXE

on:
  push:
    branches: [ "feature/backend-core", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Backend Repository
      uses: actions/checkout@v4
      with:
        path: backend

    - name: Checkout Frontend Repository
      uses: actions/checkout@v4
      with:
        ref: feature/web-ui
        path: AcidFootCongee-frontend

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller>=6.0

    - name: Build with PyInstaller
      working-directory: backend
      run: |
        python build.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeltaForceAutoBuy-Windows
        path: backend/dist/DeltaForceAutoBuy.zip
        
    - name: Release to Nightly
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "🚀 最新开发版 (Nightly Build)"
        body: "由 GitHub Actions 自动触发构建的最新测试版。\n\n**国内高速下载链接（自带加速）：**\nhttps://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/nightly/DeltaForceAutoBuy.zip"
        files: backend/dist/DeltaForceAutoBuy.zip
        prerelease: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
